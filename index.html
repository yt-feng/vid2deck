    <script>
      (function () {
        function adminTokenIsCurrent(token) {
          try {
            var payloadPart = String(token || '').split('.')[0] || '';
            var padded = payloadPart.replace(/-/g, '+').replace(/_/g, '/');
            padded += '='.repeat((4 - padded.length % 4) % 4);
            var payload = JSON.parse(atob(padded));
            return payload && payload.kind === 'admin' && payload.sub === 'twotigers_vid';
          } catch (error) {
            return false;
          }
        }
        try {
          if (!adminTokenIsCurrent(localStorage.getItem('vid2deck.admin.token'))) return;
          document.querySelectorAll('.nav-action[href="/admin/"]').forEach(function (link) {
            link.hidden = false;
          });
        } catch (error) {}
      }());
    </script>
