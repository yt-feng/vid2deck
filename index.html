<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vid2PPT Deck - 视频转幻灯片 PDF</title>
    <meta name="description" content="把视频一键生成去重版 PPT、PDF、逐字稿与 Summary。支持批量抽帧、屏幕录制、图片转 PPTX 和 Frames ZIP。" />
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #0f172a; background: #f8fafc; }
      body { margin: 0; }
      .site-nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px min(5vw, 64px); background: rgba(255,255,255,.88); border-bottom: 1px solid #e2e8f0; backdrop-filter: blur(14px); }
      .site-brand { display: flex; align-items: center; gap: 10px; color: #0f172a; font-weight: 900; text-decoration: none; }
      .site-logo { width: 34px; height: 34px; display: grid; place-items: center; color: #fff; background: #0f172a; border-radius: 11px; }
      .site-links { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
      .site-links a { color: #475569; font-weight: 800; text-decoration: none; }
      .site-links .sponsor-btn { padding: 10px 16px; color: #fff; background: #16a34a; border: 0; border-radius: 999px; font: inherit; font-weight: 900; cursor: pointer; box-shadow: 0 10px 24px rgba(22, 163, 74, .18); }
      .site-links .pricing-link { color: #fff; background: #0f172a; padding: 10px 16px; border-radius: 999px; }
      .product-strip { display: grid; gap: 14px; width: min(1120px, calc(100% - 32px)); margin: 22px auto 0; padding: 18px 20px; background: #eef6ff; border: 1px solid #bfdbfe; border-radius: 22px; color: #1e3a8a; }
      .product-strip strong { color: #0f172a; }
      .product-strip a { color: #0f172a; font-weight: 900; }
      .site-footer { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; padding: 34px 18px 48px; color: #64748b; }
      .site-footer a { color: inherit; font-weight: 800; text-decoration: none; }
      @media (max-width: 760px) { .site-nav { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <nav class="site-nav">
      <a class="site-brand" href="/"><span class="site-logo">V</span><span>Vid2PPT Deck</span></a>
      <div class="site-links">
        <a href="/">产品</a>
        <a href="#cases">案例</a>
        <a href="#reviews">用户反馈</a>
        <button id="openSiteTipDialogBtn" class="sponsor-btn" type="button">赞助本站</button>
        <a class="pricing-link" href="/pricing/">定价</a>
      </div>
    </nav>
    <section class="product-strip">
      <div><strong>产品化入口：</strong>免费试用，立即在下方上传视频；商业套餐请查看 <a href="/pricing/">/pricing/</a>。</div>
    </section>
    <main id="app"></main>
    <footer class="site-footer">
      <a href="/pricing/">Pricing</a>
      <a href="/terms-and-conditions/">Terms of Service</a>
      <a href="/privacy/">Privacy Policy</a>
      <a href="/refund/">Refund Policy</a>
      <span>© 2026 Vid2PPT Deck</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/landing.ts"></script>
  </body>
</html>
